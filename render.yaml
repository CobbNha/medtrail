services:
  - type: web
    name: medtrail
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medtrail-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: STORAGE_DIR
        value: /tmp/medtrail-storage

      - key: MAX_FILE_SIZE_MB
        value: "20"

      - key: DEMO_EMAIL
        value: admin@medtrail.local

      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: medtrail-db
    plan: free
